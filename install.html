<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="트윈디자인 근무 기록">
  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="트윈디자인">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>트윈디자인 · 홈 화면 설치</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body data-entry="install">
  <div class="shell">
    <main>
      <div class="intro">
        <img class="symbol" src="./logo.svg" alt="트윈디자인" width="144" height="75">
        <p class="brand">twin <span>design</span></p>
        <h1>홈 화면에서 만나요</h1>
        <p class="description">아이콘을 추가하면 바로 접속할 수 있어요.</p>
      </div>
      <div class="install-notes">
        <section><h2>iPhone · Safari</h2><p>공유 → 홈 화면에 추가 → 추가</p><p class="small">‘웹 앱으로 열기’가 보이면 켜주세요.</p></section>
        <section><h2>Android · Chrome</h2><p>⋮ 메뉴 → 앱 설치 / 홈 화면에 추가</p></section>
      </div>
      <div class="recovery">
        <p id="connectionStatus" class="status" role="status" aria-live="polite"></p>
        <a class="text-link" id="retryLink" href="https://script.google.com/macros/s/AKfycbxpjj3RTT7o_SYU6RBe5Q2iUxMbrNuzVPcuFRpk4Iu_C5wFCeAQRBKT9_PTDANGngUs/exec" target="_self" rel="noreferrer" hidden>다시 연결</a>
      </div>
    </main>
    <footer>TWIN DESIGN</footer>
  </div>
</body>
</html>
